name: ${PROJECT_NAME:-movibot-v9}

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: movibot-gateway
    depends_on:
      - api
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: movibot-api
    environment:
      MOVIEBOT_ENV: ${MOVIEBOT_ENV:-production}
      API_PORT: ${API_PORT:-8000}
      REDIS_URL: redis://redis:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY}
      TZ: ${TIMEZONE:-UTC}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - redis
    restart: unless-stopped

  bot-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: movibot-worker
    environment:
      MOVIEBOT_ENV: ${MOVIEBOT_ENV:-production}
      BOT_PLATFORM: ${BOT_PLATFORM:-telegram}
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
      TZ: ${TIMEZONE:-UTC}
    depends_on:
      - redis
      - api
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: movibot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  redis_data:
