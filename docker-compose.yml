services:
  app:
    build: .
    container_name: movibot-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: movibot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movibot}
      POSTGRES_USER: ${POSTGRES_USER:-movibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movibot}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: movibot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
