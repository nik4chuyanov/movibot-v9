version: "3.9"

services:
  api:
    image: ${API_IMAGE:-ghcr.io/example/movibot-api:latest}
    container_name: movibot_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - movibot_net

  bot:
    image: ${BOT_IMAGE:-ghcr.io/example/movibot-telegram-bot:latest}
    container_name: movibot_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - movibot_net

  postgres:
    image: postgres:16-alpine
    container_name: movibot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movibot}
      POSTGRES_USER: ${POSTGRES_USER:-movibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movibot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movibot} -d ${POSTGRES_DB:-movibot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - movibot_net

  redis:
    image: redis:7-alpine
    container_name: movibot_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - movibot_net

volumes:
  postgres_data:
  redis_data:

networks:
  movibot_net:
    driver: bridge
